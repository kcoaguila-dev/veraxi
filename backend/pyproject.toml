[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.json", "*.yaml", "*.yml"]


[project]
name = "veraxi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "neo4j",
    "qdrant-client",
    "mcp",
    "openai",
    "fastapi",
    "uvicorn",
    "sentry-sdk[fastapi]",
    "emoji",
    "docling",
    "python-multipart",
    "sentence-transformers",
    "fastembed",
    "torch",
    "PyJWT",
    "python-magic",
    "slowapi",
    "supabase",
    "stripe",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "litellm",
    "langchain-litellm>=0.6.4",
    "langchain-community",
    "arq",
    "redis",
    "langgraph-checkpoint-redis",
    "langchain-groq",
    "spacy",
    "trafilatura>=2.0",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "opentimelineio",
    "browser-use>=0.11",
    "playwright",
    "python-dotenv",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.15.0",
    "import-linter>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "import-linter",
    "testcontainers[neo4j,qdrant]",
]
eval = [
    "deepeval",
    "datasets",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
[tool.ruff]
lint.ignore = ["E402", "BLE001"]
lint.exclude = ["build/**"]
