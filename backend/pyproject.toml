[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.json", "*.yaml", "*.yml"]


[project.scripts]
veraxi = "veraxi.cli.main:main"
vx = "veraxi.cli.main:main"

[project]
name = "veraxi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "neo4j",
    "qdrant-client",
    "mcp>=2.3.0",
    "openai",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "sentry-sdk[fastapi]",
    "emoji",
    "python-multipart",
    "pypdf>=7.1.1",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "weasyprint",
    "markdown",
    "fastembed",
    "PyJWT",
    "python-magic",
    "slowapi",
    "supabase",
    "langgraph",
    "langchain<1.5.0",
    "langchain-core<1.9.0",
    "langchain-openai",
    "litellm",
    "langchain-litellm>=0.11.2",
    "arq",
    "redis",
    "cryptography",
    "httpx",
    "PyYAML",
    "langgraph-checkpoint-redis",
    "langchain-groq",
    "spacy",
    "trafilatura>=2.3.1",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "mcp-types>=2.3.0",
    "python-dotenv>=1.2.4",
    "duckduckgo_search>=8.1.1",
    "modal",
    "e2b",
    "tree-sitter>=0.26.1",
    "tree-sitter-language-pack>=1.25.2",
    "orjson",
]

[project.optional-dependencies]
ocr = [
    "docling",
]
browser = [
    "browser-use>=1.0.5",
    "playwright>=1.65.2",
]
full = [
    "docling",
    "browser-use>=1.0.5",
    "playwright>=1.65.2",
    "opentimelineio",
    "stripe",
]
studio = [
    "opentimelineio",
]
enterprise = [
    "stripe",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "import-linter",
    "testcontainers[neo4j,qdrant]",
]
eval = [
    "deepeval",
    "datasets",
]

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "deepeval>=4.3.4",
    "import-linter>=2.16",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "testcontainers>=4.15.0",
    "veraxi",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
[tool.ruff]
lint.ignore = ["E402", "BLE001", "I001"]
lint.exclude = ["build/**"]

[tool.uv.sources]
veraxi = { path = "../packages/veraxi-cli" }
