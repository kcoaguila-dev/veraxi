server {
    listen 80;
    server_name localhost;

    # Serve .wasm files with correct MIME type
    location ~* \.wasm$ {
        root /usr/share/nginx/html;
        types { application/wasm wasm; }
        default_type application/wasm;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Serve drift_worker.js
    location = /drift_worker.js {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        root /usr/share/nginx/html;
        # Crucial for Flutter Web: if a file isn't found, redirect to index.html
        # This allows client-side routing (e.g. /chat, /login) to work on refresh.
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets to improve performance (excluding js to prevent stale main.dart.js)
    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.js$ {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
