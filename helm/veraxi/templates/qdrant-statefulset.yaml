apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "veraxi.fullname" . }}-qdrant
  labels:
    app.kubernetes.io/name: {{ include "veraxi.name" . }}-qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "veraxi.name" . }}-qdrant
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "veraxi.name" . }}-qdrant
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          ports:
            - containerPort: 6333
              name: http
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: {{ include "veraxi.name" . }}-qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.qdrant.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "veraxi.name" . }}-qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
