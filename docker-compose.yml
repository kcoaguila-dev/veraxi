version: "3.8"
services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/changeme_local_password}
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - SEARXNG_URL=http://searxng:8080/search
    env_file:
      - ./backend/.env
    depends_on:
      - neo4j
      - qdrant
      - redis

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  code_interpreter:
    build:
      context: ./backend/code_interpreter
      dockerfile: Dockerfile
    # No ports exposed to host. Only accessible via docker network.
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: arq backend.worker.WorkerSettings
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - neo4j
      - qdrant
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        - IS_SELF_HOSTED=${IS_SELF_HOSTED:-true}
        - AUTH_ENABLED=${AUTH_ENABLED:-true}
    depends_on:
      - backend

volumes:
  neo4j_data:
  qdrant_data:
  redis_data:
  caddy_data:
  caddy_config:
