[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veraxi-runner"
version = "0.1.0"
description = "Outbound-WebSocket sandbox runner that turns user-owned hardware into a Veraxi coding sandbox"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
]

[project.scripts]
veraxi-runner = "veraxi_runner.__main__:main"

[tool.setuptools.packages.find]
include = ["veraxi_runner*"]
