name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./app

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        

    - name: Install Linux dependencies
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        sudo apt-get update && sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev dbus-x11 gnome-keyring libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa libmpv-dev

    - name: Install dependencies
      run: flutter pub get
        
    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
        
    - name: Analyze code
      run: flutter analyze
        
    - name: Run tests
      run: flutter test
        
    - name: Run integration tests
      run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 flutter test -v -d linux integration_test/
