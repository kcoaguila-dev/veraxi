name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/frontend*.yml'
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' \
              | grep -qE '^(app/|\.github/workflows/frontend.*\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  test-and-analyze:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

  test:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Linux dependencies
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        sudo apt-get update && sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev dbus-x11 gnome-keyring libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa libmpv-dev

    - name: Install dependencies
      run: flutter pub get

    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze code
      run: flutter analyze --no-fatal-infos

    - name: Run tests
      run: flutter test

    - name: Run integration tests
      run: |
        dbus-run-session -- sh -c "echo 'test' | gnome-keyring-daemon --unlock; xvfb-run -s '-screen 0 1024x768x24' -a env LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 GDK_BACKEND=x11 bash -c 'for f in integration_test/*_test.dart; do if [ \"\$f\" != \"integration_test/true_e2e_test.dart\" ]; then flutter test -d linux \"\$f\" || exit 1; fi; done'"
