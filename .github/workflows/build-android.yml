name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run unit tests
        working-directory: app
        run: flutter test test/

      - name: Build release APK (split per ABI for smaller size)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/app/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/apk/release/*.apk
          generate_release_notes: true
          name: "Veraxi ${{ github.ref_name }}"
          body: |
            ## Veraxi Android Release ${{ github.ref_name }}

            ### Installation
            1. Download the APK for your device:
               - **arm64-v8a** → Most modern Android phones (2018+)
               - **armeabi-v7a** → Older 32-bit phones
               - **x86_64** → Android emulators
            2. Enable **Install unknown apps** in your Android Settings.
            3. Open the downloaded APK and tap Install.

            > If unsure, download the arm64-v8a APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
