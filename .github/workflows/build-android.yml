name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API base URL (e.g. https://api.veraxi.me/api)'
        required: true
        default: 'https://api.veraxi.me/api'
      supabase_url:
        description: 'Supabase project URL (leave blank to use self-hosted/local mode)'
        required: false
        default: ''
      supabase_anon_key:
        description: 'Supabase anon key (leave blank to use self-hosted/local mode)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Resolve build config
        id: config
        run: |
          # When triggered via workflow_dispatch, use the typed-in input.
          # When triggered by a git tag push, fall back to repo secrets.
          echo "api_url=${{ github.event.inputs.api_url || secrets.API_URL || 'https://your-oracle-server.com/api' }}" >> $GITHUB_OUTPUT
          echo "supabase_url=${{ github.event.inputs.supabase_url || secrets.SUPABASE_URL || '' }}" >> $GITHUB_OUTPUT
          echo "supabase_anon_key=${{ github.event.inputs.supabase_anon_key || secrets.SUPABASE_ANON_KEY || '' }}" >> $GITHUB_OUTPUT

      - name: Run unit tests
        working-directory: app
        run: flutter test test/

      - name: Build release APK (split per ABI for smaller size)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_URL="${{ steps.config.outputs.api_url }}" \
            --dart-define=SUPABASE_URL="${{ steps.config.outputs.supabase_url }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ steps.config.outputs.supabase_anon_key }}"

      - name: Build debug APK (universal)
        working-directory: app
        run: |
          flutter build apk --debug \
            --dart-define=API_URL="${{ steps.config.outputs.api_url }}" \
            --dart-define=SUPABASE_URL="${{ steps.config.outputs.supabase_url }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ steps.config.outputs.supabase_anon_key }}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/app/outputs/apk/release/*.apk
            app/build/app/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/apk/release/*.apk
            app/build/app/outputs/apk/debug/*.apk
          generate_release_notes: true
          name: "Veraxi ${{ github.ref_name }}"
          body: |
            ## Veraxi Android Release ${{ github.ref_name }}

            ### Installation
            1. Download the APK for your device:
               - **arm64-v8a** → Most modern Android phones (2018+)
               - **armeabi-v7a** → Older 32-bit phones
               - **x86_64** → Android emulators
               - **app-debug.apk** → For testing with full debug logs (universal architecture, larger size)
            2. Enable **Install unknown apps** in your Android Settings.
            3. Open the downloaded APK and tap Install.

            > If unsure, download the arm64-v8a APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
