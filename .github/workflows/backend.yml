name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "backend/[dev]"

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check backend/

    - name: Test with pytest
      run: |
        pytest backend/tests/

  # -------------------------------------------------------------------------
  # Deploy to Cloud Run — only on direct pushes to main (not PRs).
  # Uses keyless Workload Identity Federation (no JSON key stored).
  # Requires two repository secrets:
  #   GCP_WORKLOAD_IDENTITY_PROVIDER — full provider resource name
  #   GCP_SERVICE_ACCOUNT            — SA email (github-deploy@...)
  # -------------------------------------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Required for Workload Identity Federation token exchange
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run
      working-directory: backend
      run: |
        gcloud run deploy veraxi-backend \
          --source . \
          --region us-east4 \
          --platform managed \
          --quiet
