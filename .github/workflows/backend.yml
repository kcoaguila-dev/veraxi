name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "backend/[dev]"

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check backend/

    - name: Test with pytest
      run: |
        pytest backend/tests/

  # -------------------------------------------------------------------------
  # Deploy to Cloud Run — only on direct pushes to main (not PRs).
  # Requires one repository secret:
  #   GCP_SA_KEY  — JSON key for a GCP service account with these roles:
  #                 Cloud Run Admin, Storage Admin, Artifact Registry Writer,
  #                 Service Account User
  # -------------------------------------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run
      working-directory: backend
      run: |
        gcloud run deploy veraxi-backend \
          --source . \
          --region us-east4 \
          --platform managed \
          --quiet
