name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "docs/site/**"
      - ".github/workflows/deploy-pages.yml"

  # Allow triggering manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (release)
        run: |
          flutter clean
          flutter build web --release \
            --base-href "/app/" \
            --pwa-strategy=none \
            --dart-define=API_URL=${{ secrets.API_URL }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=AUTH_ENABLED=true \
            --dart-define=IS_SELF_HOSTED=true

      - name: Stage static landing site and Flutter app
        working-directory: .
        run: |
          rm -rf gh_pages_dist
          mkdir -p gh_pages_dist/app
          cp docs/site/index.html gh_pages_dist/index.html
          cp -r app/build/web/* gh_pages_dist/app/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh_pages_dist
          # Keep a custom domain file in the output so GitHub Pages
          # does not drop the veraxi.me CNAME on every deploy.
          cname: veraxi.me
