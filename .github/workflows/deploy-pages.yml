name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"

  # Allow triggering manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (release)
        run: |
          flutter build web --release \
            --dart-define=API_URL=${{ secrets.API_URL }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=AUTH_ENABLED=true \
            --dart-define=IS_SELF_HOSTED=false

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/build/web
          # Keep a custom domain file in the output so GitHub Pages
          # does not drop the veraxi.me CNAME on every deploy.
          cname: veraxi.me
