name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/veraxi-cli/**'
      - '.github/workflows/backend*.yml'
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' \
              | grep -qE '^(backend/|packages/veraxi-cli/|\.github/workflows/backend.*\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  test-and-lint:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip install -e ../packages/veraxi-cli
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm || true

      - name: Lint with ruff
        run: ruff check .

      - name: Static Type Checking with Mypy
        run: |
          mypy . --ignore-missing-imports

      - name: AST Semantic Scan with Semgrep
        run: |
          python -m venv /tmp/semgrep-env
          /tmp/semgrep-env/bin/pip install semgrep
          /tmp/semgrep-env/bin/semgrep --config p/python --error .

      - name: Dead Code Detection with Vulture
        run: |
          pip install vulture
          vulture . --exclude tests --min-confidence 100 || true

      - name: Complexity Check with Radon
        run: |
          pip install radon
          radon mi --fail C . || true

      - name: Docstring Coverage with Interrogate
        run: |
          pip install interrogate
          interrogate -vv -i --fail-under=80 . || true

      - name: Security audit with pip-audit
        run: pip-audit || true

      - name: Dockerfile Linter with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
          no-fail: true

      - name: Container Security Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Check License Compliance
        run: |
          pip install pip-licenses
          pip-licenses --fail-on="GPL;AGPL" --partial-match || true

      - name: Run tests with pytest
        run: pytest -p no:deepeval --ignore=tests/test_rag_deepeval.py --ignore=tests/custom_openai_eval.py --ignore=evaluation/
