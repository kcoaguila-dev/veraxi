version: 2
updates:
  # Scan the backend for Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # datasets>=5.2.0 is incompatible with deepeval (see the comment in
    # backend/pyproject.toml [dependency-groups]): datasets 5.2 pulls
    # huggingface-hub>=1.31, which requires click>=8.4.2, while deepeval
    # requires click<8.4.0, so universal `uv lock` resolution fails.
    # PR #225 proposed exactly this bump; keep datasets below 5.2.0 until
    # deepeval relaxes its click bound.
    ignore:
      - dependency-name: "datasets"
        versions: [">=5.2.0"]

  # Scan the frontend for Flutter dependencies (pub)
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # objectbox 6.x and sqlite3_flutter_libs >= 0.6.0 (the 0.6.0+eol line)
    # were pulled into a "minor-and-patch" bundle by PR #213 even though
    # both are breaking, intentional post-v1.0 migrations. Keep them out of
    # Dependabot's automatic updates until those migrations are scheduled:
    # https://github.com/kcoaguila-dev/veraxi/pull/213
    ignore:
      - dependency-name: "objectbox*"
        versions: [">=6.0.0-0"]
      - dependency-name: "sqlite3_flutter_libs"
        versions: [">=0.6.0"]

  # Scan for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
