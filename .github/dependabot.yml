version: 2
updates:
  # Scan the backend for Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # datasets>=5.1.0 is incompatible with deepeval (see the comment in
    # backend/pyproject.toml [dependency-groups]): datasets>=5.1 pulls
    # huggingface-hub>=1.31, which requires click>=8.4.2, while deepeval
    # requires click<8.4.0, so universal `uv lock` resolution fails.
    # Keep datasets below 5.1.0 until deepeval relaxes its click bound.
    ignore:
      - dependency-name: "datasets"
        versions: [">=5.1.0"]
      # docling-core[chunking] (via [full]/[ocr]) requires tree-sitter<0.27.0.
      - dependency-name: "tree-sitter"
        versions: [">=0.27.0"]

  # Scan the frontend for Flutter dependencies (pub)
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "objectbox*"
    # objectbox 6.x (incl. 6.0.0-rc.1) and sqlite3_flutter_libs >= 0.6.0
    # are breaking, intentional post-v1.0 migrations. Ignore all
    # objectbox* updates until the 6.x migration is scheduled.
    ignore:
      - dependency-name: "objectbox"
      - dependency-name: "objectbox_flutter_libs"
      - dependency-name: "objectbox_generator"
      - dependency-name: "sqlite3_flutter_libs"
        versions: [">=0.6.0"]

  # Scan for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
