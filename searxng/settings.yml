# SearXNG configuration for Veraxi
# Enhanced with anti-bot rate-limiting and outgoing proxy support from AI_PROJECT

use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "myveraxisecretkey123"
  limiter: true
  image_proxy: true

# Outgoing proxy support: route through SOCKS5 (e.g. Tor daemon at socks5://tor:9050)
outgoing:
  using_tor_proxy: false
  # proxies:
  #   all://:
  #     - socks5://tor:9050

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

# Whitelisted engines with weights and timeouts to avoid CAPTCHA/honeypot blocks
engines:
  - name: yandex
    engine: yandex
    weight: 2
    timeout: 10.0
    disabled: false
  - name: bing news
    engine: bing_news
    weight: 1.5
    timeout: 10.0
    disabled: false
  - name: wikipedia
    engine: wikipedia
    disabled: false
  - name: google
    engine: google
    disabled: true
  - name: bing
    engine: bing
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    disabled: true
  - name: startpage
    engine: startpage
    disabled: true
  - name: brave
    engine: brave
    disabled: true
  - name: qwant
    engine: qwant
    disabled: true
  - name: yahoo
    engine: yahoo
    disabled: true
