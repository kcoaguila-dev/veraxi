<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Visual Contract: Veraxi "Ask Veraxi to Fix in Code Thread" Flow
       Shows what happens after clicking "Ask Veraxi to Fix in Code Thread ->"
       from veraxi_security_workbench.svg.
       Synthesizes rival strengths + Reddit senior-dev guardrails:
       1. No blind PR spam: opens a grounded Code Thread + Diff Review split pane.
       2. Prefilled Neo4j context: CVE/KEV/EPSS + all 3 reachable call sites.
       3. Graph-aware impact check: checks all callers before editing.
       4. Sandbox verification loop (GitHub Copilot Autofix style): runs pytest
          and re-checks CVE status inside sandbox BEFORE surfacing the diff.
       5. Human-in-the-loop gate: Discard / Apply Patch / Open Draft PR — never
          auto-merges or auto-commits without developer review.
       Tokens: ObsidianTokens (#0D0E11 rail/review, #0A0B0D center, #181A20 bubble,
       #0F291A diffAddBg, #2A1215 diffRemoveBg, #1E2026 hairline, #282B36 border). -->
