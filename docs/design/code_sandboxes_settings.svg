  <!-- Section 5: Active Sandboxes -->
  <text x="48" y="1232" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Active Sandboxes</text>
  <rect x="48" y="1252" width="1320" height="118" rx="12" fill="#2F2F2F" stroke="#3F3F3F"/>
  <circle cx="84" cy="1290" r="5" fill="#10B981"/>
  <text x="100" y="1295" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">modal · running</text>
  <text x="260" y="1295" font-family="Inter, sans-serif" font-size="12" fill="#9E9E9E">branch: sandbox/session-1 · last active 2026-11-18T00:00:00Z</text>
  <rect x="1050" y="1270" width="90" height="36" rx="8" fill="none" stroke="#3F3F3F"/>
  <text x="1095" y="1293" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pause</text>
  <rect x="1154" y="1270" width="100" height="36" rx="8" fill="none" stroke="#F87171"/>
  <text x="1204" y="1293" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F87171" text-anchor="middle">Destroy</text>
  <text x="72" y="1346" font-family="Inter, sans-serif" font-size="12" fill="#9E9E9E">Sessions come from GET /api/v1/sandboxes/sessions. Pause → POST …/sessions/{id}/pause · Destroy → DELETE …/sessions/{id}.</text>
</svg>
