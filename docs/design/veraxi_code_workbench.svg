      <path d="M17 8 L23 11 V16 C23 19.5 20.4 22.3 17 23.2 C13.6 22.3 11 19.5 11 16 V11 L17 8 Z" stroke="#FFFFFF" stroke-width="1.4" fill="none"/>
      <text x="34" y="21" fill="#FFFFFF" font-weight="600">Vuln Intel</text>
