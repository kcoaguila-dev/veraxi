      <rect x="10" y="9" width="14" height="14" rx="3" stroke="#9CA3AF" stroke-width="1.4" fill="none"/>
      <line x1="13" y1="14" x2="21" y2="14" stroke="#9CA3AF" stroke-width="1.4"/>
