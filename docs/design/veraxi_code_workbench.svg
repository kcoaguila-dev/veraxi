      <circle cx="16" cy="18" r="4" fill="#10B981"/>
      <text x="30" y="16" fill="#E4E4E7" font-weight="500">veraxi/backend</text>
      <text x="30" y="29" fill="#71717A" font-size="10.5">142 files · 812 symbols</text>
    </g>
    <g transform="translate(14, 504)">
      <rect x="0" y="0" width="232" height="36" rx="7" fill="transparent"/>
      <circle cx="16" cy="18" r="4" fill="#52525B"/>
      <text x="30" y="16" fill="#A1A1AA" font-weight="500">veraxi/app</text>
      <text x="30" y="29" fill="#52525B" font-size="10.5">96 files · Dart AST</text>
    </g>
