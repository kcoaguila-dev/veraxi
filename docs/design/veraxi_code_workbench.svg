      <rect x="10" y="10" width="5" height="5" rx="1" stroke="#9CA3AF" stroke-width="1.3" fill="none"/>
      <rect x="19" y="10" width="5" height="5" rx="1" stroke="#9CA3AF" stroke-width="1.3" fill="none"/>
      <rect x="15" y="19" width="5" height="5" rx="1" stroke="#9CA3AF" stroke-width="1.3" fill="none"/>
