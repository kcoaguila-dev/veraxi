      <rect x="12" y="10" width="12" height="13" rx="2" stroke="#9CA3AF" stroke-width="1.4" fill="none"/>
      <path d="M9 13 V24 C9 25.1 9.9 26 11 26 H21" stroke="#9CA3AF" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <text x="34" y="21.5" fill="#D4D4D8">Knowledge Hub</text>
