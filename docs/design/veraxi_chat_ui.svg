<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- Visual contract: Live Veraxi Chat UI (dark theme, 260px sidebar + main chat canvas)
       - Left sidebar (ChatSidebar, 260px, #171717): Veraxi brand + collapse toggle,
         Projects / New chat / Knowledge Hub navigation, Chats list, user profile footer.
       - Top bar (ChatScreen): ModelSelectorMenu pill, Metrics switch, TokenUsage style icon,
         and top-right New chat / Temporary chat action.
       - Conversation column (max-width 800 centered, #212121):
         Right-aligned user message bubble, assistant message with plain-language
         ChatActivityDisclosure, grounded prose with named CitationChip pills, action bar
         with SourcesButton ("3 sources"), and floating ChatInput composer with
         attachments, tools menu, Web Search pill, TokenUsageRing, mic, and send button. -->
  <rect width="1440" height="900" fill="#212121"/>

  <!-- Left Sidebar (260px, #171717) -->
  <rect x="0" y="0" width="260" height="900" fill="#171717"/>
  <text x="20" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Veraxi</text>
  <rect x="220" y="22" width="18" height="18" rx="4" fill="none" stroke="#B4B4B4" stroke-width="1.5"/>
  <line x1="227" y1="22" x2="227" y2="40" stroke="#B4B4B4" stroke-width="1.5"/>

  <!-- Sidebar Navigation -->
  <g font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#E0E0E0">
    <rect x="20" y="68" width="16" height="13" rx="2" fill="none" stroke="#B4B4B4" stroke-width="1.5"/>
    <text x="48" y="80">Projects</text>

    <rect x="20" y="102" width="15" height="15" rx="2" fill="none" stroke="#B4B4B4" stroke-width="1.5"/>
    <line x1="27" y1="102" x2="35" y2="110" stroke="#B4B4B4" stroke-width="1.5"/>
    <text x="48" y="114">New chat</text>

    <rect x="20" y="136" width="15" height="15" rx="2" fill="none" stroke="#B4B4B4" stroke-width="1.5"/>
    <line x1="24" y1="141" x2="31" y2="141" stroke="#B4B4B4" stroke-width="1.5"/>
    <text x="48" y="148">Knowledge Hub</text>
  </g>

  <!-- Chats Section -->
  <text x="20" y="188" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#878787">Chats ⌄</text>
  <g font-family="Inter, sans-serif" font-size="13">
    <text x="28" y="220" fill="#B4B4B4">Jensen Situation Update</text>
    <rect x="16" y="236" width="228" height="30" rx="8" fill="#2E2E2E"/>
    <text x="28" y="255" font-weight="500" fill="#FFFFFF">NVIDIA CEO Update</text>
    <text x="220" y="255" fill="#FFFFFF">•••</text>
    <text x="28" y="288" fill="#B4B4B4">Stock Market Today</text>
    <text x="28" y="318" fill="#B4B4B4">Hello World Slide</text>
    <text x="28" y="348" fill="#B4B4B4">GitHub Access Inquiry</text>
  </g>

  <!-- Sidebar Footer Profile -->
  <circle cx="32" cy="866" r="14" fill="#2F2F2F"/>
  <text x="32" y="871" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">K</text>
  <text x="58" y="871" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Kazuo Coaguila</text>

  <!-- Top Bar -->
  <rect x="280" y="14" width="198" height="34" rx="8" fill="#1E1E1E" stroke="#2A2A2A"/>
  <circle cx="298" cy="31" r="7" fill="#E6522C"/>
  <text x="314" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">openai/gpt-oss-20b</text>
  <text x="458" y="36" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF">⌄</text>

  <text x="494" y="36" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#878787">Metrics</text>
  <rect x="546" y="22" width="32" height="18" rx="9" fill="#3A3A3A"/>
  <circle cx="555" cy="31" r="7" fill="#FFFFFF"/>

  <circle cx="602" cy="31" r="8" fill="none" stroke="#878787" stroke-width="1.5"/>
  <rect x="1392" y="22" width="16" height="16" rx="3" fill="none" stroke="#878787" stroke-width="1.5"/>

  <!-- Centered Chat Thread Column (maxWidth 800, x=450..1250) -->
  <!-- User Bubble -->
  <rect x="970" y="110" width="240" height="44" rx="18" fill="#2A2A2A" stroke="#333333"/>
  <text x="990" y="137" font-family="Inter, sans-serif" font-size="14" fill="#ECECEC">whos the ceo of nvidia now?</text>

  <!-- Assistant Message -->
  <circle cx="514" cy="212" r="8" fill="#E6522C"/>
  <text x="538" y="217" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">openai/gpt-oss-20b</text>

  <!-- Plain-language Activity Disclosure -->
  <text x="538" y="246" font-family="Inter, sans-serif" font-size="12" fill="#9E9E9E">›  Searched the web · Checked your corpus</text>

  <!-- Grounded Response Prose & Named Citation Pill -->
  <text x="538" y="280" font-family="Inter, sans-serif" font-size="14" fill="#ECECEC">The current chief executive officer of NVIDIA is Colette Marie Kress, who has been</text>
  <text x="538" y="302" font-family="Inter, sans-serif" font-size="14" fill="#ECECEC">serving as the interim CEO since Jensen Huang's resignation in November 2026.</text>

  <rect x="538" y="314" width="180" height="22" rx="11" fill="#272727" stroke="#3D3D3D"/>
  <circle cx="550" cy="325" r="5" fill="#4F8EF7"/>
  <text x="562" y="329" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#CCCCCC">Colette Kress - Wikipedia</text>
  <text x="698" y="329" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#8C8C8C">+1</text>

  <text x="538" y="362" font-family="Inter, sans-serif" font-size="14" fill="#ECECEC">Would you like more details about her background or NVIDIA's recent leadership</text>
  <text x="538" y="384" font-family="Inter, sans-serif" font-size="14" fill="#ECECEC">changes?</text>

  <!-- Action Bar & SourcesButton -->
  <g fill="#878787" font-family="Inter, sans-serif" font-size="12">
    <text x="538" y="420">🔊  ❐  ✎  👍  👎  ↻  🔖   2d ago</text>
  </g>
  <rect x="748" y="402" width="110" height="26" rx="13" fill="#222226" stroke="#2E2E34"/>
  <circle cx="764" cy="415" r="6" fill="#4F8EF7" stroke="#222226" stroke-width="1.5"/>
  <circle cx="774" cy="415" r="6" fill="#3FB68B" stroke="#222226" stroke-width="1.5"/>
  <circle cx="784" cy="415" r="6" fill="#D98A2B" stroke="#222226" stroke-width="1.5"/>
  <text x="796" y="419" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#E0E0E0">3 sources</text>

  <!-- Floating ChatInput Composer -->
  <rect x="450" y="746" width="800" height="104" rx="24" fill="#2A2A2A" stroke="#363636"/>
  <text x="474" y="780" font-family="Inter, sans-serif" font-size="14" fill="#878787">Message Veraxi...</text>

  <!-- Composer Toolbar -->
  <text x="474" y="828" font-family="Inter, sans-serif" font-size="15" fill="#B4B4B4">📎   sliders</text>
  <rect x="540" y="808" width="102" height="28" rx="14" fill="#1F2937" stroke="#3B82F6"/>
  <text x="556" y="827" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#93C5FD">🌐 Web Search</text>

  <!-- TokenUsageRing + Mic + Send -->
  <circle cx="1130" cy="822" r="14" fill="none" stroke="#878787" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="1130" y="826" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#E0E0E0" text-anchor="middle">2.4k</text>
  <text x="1168" y="827" font-family="Inter, sans-serif" font-size="15" fill="#B4B4B4">🎤</text>
  <circle cx="1216" cy="822" r="16" fill="#424242"/>
  <path d="M 1216 828 L 1216 816 M 1210 822 L 1216 816 L 1222 822" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Footer Legal Text -->
  <text x="850" y="878" font-family="Inter, sans-serif" font-size="12" fill="#878787" text-anchor="middle">Veraxi v0.1.0 - Sovereign Intelligence. Privacy policy | Terms of service</text>
</svg>
