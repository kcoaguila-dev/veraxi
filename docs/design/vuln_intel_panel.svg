<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- Visual contract: Vuln Intel panel in Knowledge Hub
       (vuln_intel_panel.dart, fed by code_intel_view_model.dart over
       POST /api/v1/vuln/sync and POST /api/v1/vuln/report).
       Rules: severity badges CRITICAL #DC2626 / HIGH #EA580C /
       MEDIUM #F59E0B / LOW #71717A / unknown severity = no badge;
       KEV findings carry a filled KEV pill; match_status 'matched'
       and 'unknown' are visually distinct (unknown is outlined and
       labelled "Unknown — version/range unparseable", never shown
       as confirmed vulnerable); CWE ids render as small tags;
       a severity filter row narrows the list client-side.
       Extension (security panels): findings may carry an EPSS badge
       ("EPSS 87.3%" = epss_score as a percentage, violet) and a Code
       Reachability pill ("Reachable in Code - N files") that expands
       to the reachable paths/symbols; a quick-filter chip row offers
       All / KEV Only / High EPSS >= 0.5 / Reachable in Code on top of
       the severity chips; an "Include reachability" toggle and an
       "Upload SBOM (CycloneDX/SPDX)" action sit beside the repo path
       actions, and an uploaded SBOM replaces the repo path as the
       scan source (its file name is shown with a clear action).
       Colors: surface #1F1F23, border #2E2E34, card #222226. -->
  <rect width="1440" height="900" fill="#0E0E10"/>
  <rect x="0" y="0" width="1440" height="900" fill="#171719"/>
  <text x="48" y="64" font-family="Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700">Vulnerability Intel</text>
  <rect x="48" y="88" width="1344" height="460" rx="16" fill="#222226" stroke="#2E2E34"/>
  <rect x="72" y="112" width="170" height="38" rx="8" fill="#2E2E34"/>
  <text x="90" y="136" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Sync NVD &amp; KEV</text>
  <rect x="258" y="112" width="190" height="38" rx="8" fill="#2E2E34"/>
  <text x="276" y="136" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Run Vulnerability Scan</text>
  <text x="72" y="182" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">Filter: All · Critical · High · Medium · Matched only · KEV only</text>
  <rect x="72" y="202" width="1296" height="72" rx="12" fill="#1F1F23" stroke="#2E2E34"/>
  <rect x="88" y="216" width="74" height="22" rx="11" fill="#EA580C"/>
  <text x="102" y="231" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">HIGH</text>
  <rect x="170" y="216" width="44" height="22" rx="11" fill="#8B7CF6"/>
  <text x="182" y="231" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">KEV</text>
  <text x="88" y="260" font-family="Inter, sans-serif" font-size="13" fill="#ECECEC">requests 2.31.0 — CVE-2024-0001 · Matched</text>
  <text x="560" y="260" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">[CWE-79]</text>
  <rect x="72" y="286" width="1296" height="72" rx="12" fill="#1F1F23" stroke="#F59E0B"/>
  <text x="88" y="330" font-family="Inter, sans-serif" font-size="13" fill="#F59E0B">legacy-lib — CVE-2023-9999 · Unknown (version/range unparseable)</text>
  <rect x="72" y="560" width="220" height="38" rx="8" fill="#2E2E34"/>
  <text x="90" y="584" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Upload SBOM (CycloneDX/SPDX)</text>
  <rect x="308" y="560" width="190" height="38" rx="19" fill="#3B0764"/>
  <text x="326" y="584" font-family="Inter, sans-serif" font-size="12" fill="#DDD6FE">Include reachability: On</text>
  <rect x="72" y="620" width="86" height="26" rx="13" fill="#8B7CF6"/>
  <text x="86" y="637" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">EPSS 87.3%</text>
  <rect x="166" y="620" width="216" height="26" rx="13" fill="#164E63"/>
  <text x="180" y="637" font-family="Inter, sans-serif" font-size="11" fill="#A5F3FC">Reachable in Code - 3 files</text>
  <text x="72" y="676" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">Quick filter: All - KEV Only - High EPSS &gt;= 0.5 - Reachable in Code</text>
</svg>
