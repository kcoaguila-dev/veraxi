<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Visual Contract: Veraxi Knowledge Hub (All Hybrid GraphRAG & Pipeline Plumbing)
       Keeps Code Mode clean by housing all ingestion, code-graph indexing,
       corpus briefings, dbt lineage, schema extraction, and DB monitors here:
       1. [Sources & Ingestion]: Corpus health, file/URL ingestion, Indexed Sources
       2. [Repo X-Ray]: Code graph indexing, AST overview, symbol & impact lookup
       3. [Corpus & Lineage]: Corpus Briefing + dbt Lineage
       4. [Schema & Extraction]: Extraction rules & entity schemas
       5. [Infra & Monitors]: Neo4j + Qdrant health & link integrity -->
  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Main Canvas -->
  <rect width="1440" height="900" fill="#0A0B0D"/>

  <!-- LEFT RAIL (268px, #0D0E11) -->
  <rect x="0" y="0" width="268" height="900" fill="#0D0E11"/>
  <line x1="268" y1="0" x2="268" y2="900" stroke="#1E2026" stroke-width="1"/>
  <text x="18" y="32" fill="#F4F4F5" font-size="15" font-weight="600" class="sans">Veraxi</text>

  <rect x="16" y="48" width="236" height="26" rx="8" fill="#13151A" stroke="#1E2026"/>
  <text x="62" y="65" fill="#71717A" font-size="11.5" class="sans">Chat</text>
  <rect x="136" y="50" width="114" height="22" rx="6" fill="#23252C" stroke="#2F323C" stroke-width="0.8"/>
  <text x="168" y="65" fill="#F4F4F5" font-size="11.5" font-weight="600" class="sans">&lt;&gt; Code</text>

  <text x="38" y="106" fill="#A1A1AA" font-size="12.5" class="sans">Projects</text>
  <rect x="10" y="116" width="248" height="34" rx="8" fill="#181A20" stroke="#282B36"/>
  <text x="38" y="137" fill="#F4F4F5" font-size="12.5" font-weight="600" class="sans">Knowledge Hub</text>

  <!-- CENTER KNOWLEDGE HUB (1172px) -->
  <rect x="268" y="0" width="1172" height="52" fill="#0D0E11"/>
  <line x1="268" y1="52" x2="1440" y2="52" stroke="#1E2026" stroke-width="1"/>
  <text x="296" y="32" fill="#F4F4F5" font-size="15" font-weight="600" class="sans">Knowledge Hub</text>
  <text x="416" y="32" fill="#71717A" font-size="12.5" class="sans">Hybrid GraphRAG · Ingestion · Indexing · Lineage</text>

  <!-- 5 Focused Tabs -->
  <rect x="296" y="72" width="1116" height="40" rx="10" fill="#13151A" stroke="#1E2026"/>
  <rect x="301" y="77" width="164" height="30" rx="7" fill="#1F222A" stroke="#2F3340"/>
  <text x="318" y="96" fill="#F4F4F5" font-size="12" font-weight="600" class="sans">Sources &amp; Ingestion</text>
  <text x="488" y="96" fill="#A1A1AA" font-size="12" class="sans">Repo X-Ray</text>
  <text x="588" y="96" fill="#A1A1AA" font-size="12" class="sans">Corpus &amp; Lineage</text>
  <text x="722" y="96" fill="#A1A1AA" font-size="12" class="sans">Schema &amp; Extraction</text>
  <text x="876" y="96" fill="#A1A1AA" font-size="12" class="sans">Infra &amp; Monitors</text>

  <!-- Corpus Health Strip -->
  <rect x="296" y="128" width="1116" height="72" rx="12" fill="#13151A" stroke="#1E2026"/>
  <text x="320" y="156" fill="#71717A" font-size="10.5" font-weight="600" letter-spacing="0.7" class="sans">HYBRID GRAPHRAG CORPUS</text>
  <text x="320" y="180" fill="#F4F4F5" font-size="14" font-weight="600" class="sans">14,280 Qdrant chunks · 3,910 Neo4j entities · 2 indexed repos</text>
  <rect x="1256" y="148" width="136" height="32" rx="8" fill="#10B981"/>
  <text x="1282" y="168" fill="#052E16" font-size="12" font-weight="600" class="sans">Ingest Source</text>

  <!-- Indexed Sources & Freshness Table -->
  <rect x="296" y="218" width="1116" height="320" rx="12" fill="#131417" stroke="#1E2026"/>
  <text x="320" y="250" fill="#F4F4F5" font-size="14" font-weight="600" class="sans">Indexed Sources &amp; Code Repositories</text>
  <line x1="296" y1="268" x2="1412" y2="268" stroke="#1E2026"/>
  <text x="320" y="294" fill="#71717A" font-size="11.5" font-weight="600" class="sans">Source</text>
  <text x="720" y="294" fill="#71717A" font-size="11.5" font-weight="600" class="sans">Type</text>
  <text x="880" y="294" fill="#71717A" font-size="11.5" font-weight="600" class="sans">Graph / Vector</text>
  <text x="1100" y="294" fill="#71717A" font-size="11.5" font-weight="600" class="sans">Freshness</text>
  <line x1="296" y1="308" x2="1412" y2="308" stroke="#1E2026"/>

  <text x="320" y="338" fill="#F4F4F5" font-size="13" class="mono">veraxi/backend</text>
  <text x="720" y="338" fill="#A1A1AA" font-size="12" class="sans">Git Repo (AST)</text>
  <text x="880" y="338" fill="#D4D4D8" font-size="12" class="mono">482 files · 3,120 nodes</text>
  <text x="1100" y="338" fill="#34D399" font-size="12" class="mono">HEAD 8f4a19c</text>
  <line x1="320" y1="356" x2="1388" y2="356" stroke="#181A20"/>

  <text x="320" y="384" fill="#F4F4F5" font-size="13" class="mono">nist_nvd_kev_2026.json</text>
  <text x="720" y="384" fill="#A1A1AA" font-size="12" class="sans">Corpus Doc</text>
  <text x="880" y="384" fill="#D4D4D8" font-size="12" class="mono">1,420 chunks · 790 nodes</text>
  <text x="1100" y="384" fill="#34D399" font-size="12" class="mono">Synced 12m ago</text>
</svg>
