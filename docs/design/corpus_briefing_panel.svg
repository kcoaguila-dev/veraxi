<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- Visual contract: Corpus Briefing & dbt Lineage in Knowledge Hub
       (DataPipelineView, below Database Monitors).
       Implemented by corpus_briefing_panel.dart fed by
       corpus_insights_view_model.dart over GET /api/v1/corpus/briefing,
       POST /api/v1/dbt/ingest, GET /api/v1/dbt/datasets.
       Rules: counts come from generated_from; themes are
       top_communities with their top_entities; contradiction flags
       render ONLY when non-empty and are labelled heuristic;
       Copy puts the markdown on the Clipboard, Download saves
       corpus_briefing.md via the artifact download helper.
       dbt card: file_picker reads manifest.json, posts {manifest},
       then dataset search lists matches with upstream/downstream.
       Colors: surface #1F1F23, border #2E2E34, card #222226,
       text #ECECEC / #A1A1AA, accent AppThemeExtension gradient. -->
  <rect width="1440" height="900" fill="#0E0E10"/>
  <rect x="0" y="0" width="1440" height="900" fill="#171719"/>
  <text x="48" y="64" font-family="Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700">Knowledge Base</text>

  <rect x="48" y="96" width="1344" height="330" rx="16" fill="#222226" stroke="#2E2E34"/>
  <text x="72" y="132" font-family="Inter, sans-serif" font-size="16" fill="#FFFFFF" font-weight="600">Corpus Briefing</text>
  <rect x="1150" y="112" width="104" height="30" rx="8" fill="#2E2E34"/>
  <text x="1180" y="132" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Copy MD</text>
  <rect x="1266" y="112" width="110" height="30" rx="8" fill="#2E2E34"/>
  <text x="1284" y="132" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Download</text>
  <rect x="72" y="156" width="180" height="64" rx="12" fill="#1F1F23" stroke="#2E2E34"/>
  <text x="88" y="184" font-family="Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700">12,480</text>
  <text x="88" y="204" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">Nodes</text>
  <rect x="268" y="156" width="180" height="64" rx="12" fill="#1F1F23" stroke="#2E2E34"/>
  <text x="284" y="184" font-family="Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700">9,312</text>
  <text x="284" y="204" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">Relationships</text>
  <rect x="464" y="156" width="180" height="64" rx="12" fill="#1F1F23" stroke="#2E2E34"/>
  <text x="480" y="184" font-family="Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700">5</text>
  <text x="480" y="204" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA">Communities</text>
  <text x="72" y="252" font-family="Inter, sans-serif" font-size="13" fill="#ECECEC" font-weight="600">Top communities</text>
  <text x="72" y="278" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">Community 0 (size 42) — Acme Corp, Beta LLC, Gamma Inc</text>
  <text x="72" y="306" font-family="Inter, sans-serif" font-size="13" fill="#ECECEC" font-weight="600">Newest entities</text>
  <text x="72" y="332" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">Delta Ltd · Organization · first seen 2026-11-12</text>
  <text x="72" y="366" font-family="Inter, sans-serif" font-size="13" fill="#ECECEC" font-weight="600">Contradiction flags (heuristic — worth a human look)</text>
  <text x="72" y="392" font-family="Inter, sans-serif" font-size="12" fill="#F59E0B">Acme Corp — HEADQUARTERED_IN → 2 distinct targets</text>

  <rect x="48" y="450" width="1344" height="300" rx="16" fill="#222226" stroke="#2E2E34"/>
  <text x="72" y="486" font-family="Inter, sans-serif" font-size="16" fill="#FFFFFF" font-weight="600">dbt Lineage</text>
  <rect x="72" y="502" width="220" height="34" rx="8" fill="#2E2E34"/>
  <text x="88" y="524" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Upload manifest.json</text>
  <rect x="72" y="556" width="420" height="38" rx="8" fill="#1F1F23" stroke="#2E2E34"/>
  <text x="88" y="580" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Search datasets or columns…</text>
  <text x="72" y="626" font-family="Inter, sans-serif" font-size="13" fill="#ECECEC" font-weight="600">users (Dataset · matched by name)</text>
  <text x="72" y="650" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">Upstream: raw_users · Downstream: daily_active_users</text>
</svg>
