<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="modalBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="emeraldBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="#09090B"/>
  <text x="48" y="42" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="16" font-weight="600">
    Veraxi · Connect Repository Modal — GitHub App States (Design Contract)
  </text>
  <text x="48" y="62" fill="#71717A" font-family="Inter, sans-serif" font-size="12">
    Selected-Repos Read-Only OAuth + Repository Picker · Zero-Retention Ephemeral AST Indexing
  </text>

  <!-- LEFT: STATE 1 (UNCONNECTED / PERMISSION TRANSPARENCY) -->
  <text x="48" y="98" fill="#34D399" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    STATE 1 · UNCONNECTED (PERMISSION TRANSPARENCY + INSTALL CTA)
  </text>
  <rect x="48" y="112" width="560" height="580" rx="14" fill="url(#modalBg)" stroke="#27272A" stroke-width="1.2"/>
  <text x="72" y="148" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="17" font-weight="600">Connect a repository</text>
  <text x="72" y="168" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12">Index a codebase into Veraxi's Neo4j + Qdrant GraphRAG.</text>

  <!-- Tabs -->
  <rect x="72" y="188" width="512" height="38" rx="9" fill="#0B0B0E" stroke="#222227"/>
  <text x="155" y="211" fill="#71717A" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Local Path</text>
  <text x="328" y="211" fill="#71717A" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Git URL / PAT</text>
  <rect x="415" y="191" width="166" height="32" rx="7" fill="#18181B" stroke="#2E2E36"/>
  <text x="498" y="211" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GitHub App</text>

  <!-- Permission Card -->
  <rect x="72" y="244" width="512" height="198" rx="10" fill="#121217" stroke="#27272D"/>
  <text x="92" y="272" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="13" font-weight="600">
    Selected-Repos Read-Only GitHub App
  </text>
  <text x="92" y="294" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11.5">
    Grant access only to repositories you pick. Never requests account-wide write scope.
  </text>
  <rect x="92" y="310" width="142" height="24" rx="6" fill="#111916" stroke="#1E352C"/>
  <text x="163" y="326" fill="#34D399" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">Contents: Read-only</text>
  <rect x="242" y="310" width="146" height="24" rx="6" fill="#111916" stroke="#1E352C"/>
  <text x="315" y="326" fill="#34D399" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">Metadata: Read-only</text>
  <rect x="396" y="310" width="136" height="24" rx="6" fill="#18181B" stroke="#27272A"/>
  <text x="464" y="326" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">Zero Write Access</text>

  <rect x="92" y="358" width="472" height="38" rx="8" fill="url(#emeraldBtn)"/>
  <text x="328" y="381" fill="#052E16" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
    Install GitHub App &amp; Select Repos
  </text>

  <!-- Trust bar -->
  <rect x="72" y="544" width="512" height="58" rx="9" fill="#111916" stroke="#1E352C"/>
  <text x="92" y="568" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="12" font-weight="600">
    Read-only &amp; zero-retention by default
  </text>
  <text x="92" y="586" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">
    Veraxi indexes AST into Neo4j, deletes temporary archives immediately, and never trains on code.
  </text>

  <!-- RIGHT: STATE 2 (CONNECTED REPO PICKER) -->
  <text x="668" y="98" fill="#34D399" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    STATE 2 · CONNECTED REPO PICKER + AUTO-SYNC TOGGLE
  </text>
  <rect x="668" y="112" width="560" height="580" rx="14" fill="url(#modalBg)" stroke="#27272A" stroke-width="1.2"/>
  <text x="692" y="148" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="17" font-weight="600">Connect a repository</text>
  <text x="692" y="168" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12">Select a granted GitHub repository to index.</text>

  <!-- Account header pill -->
  <rect x="692" y="192" width="512" height="36" rx="8" fill="#121217" stroke="#27272D"/>
  <text x="708" y="214" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="12" font-weight="600">acme-org · 3 repos granted</text>
  <text x="1188" y="214" fill="#34D399" font-family="Inter, sans-serif" font-size="11.5" text-anchor="end">Manage on GitHub</text>

  <!-- Search filter -->
  <rect x="692" y="240" width="512" height="36" rx="8" fill="#0B0B0E" stroke="#27272A"/>
  <text x="708" y="262" fill="#52525B" font-family="Inter, sans-serif" font-size="12">Filter granted repositories...</text>

  <!-- Repo list rows -->
  <rect x="692" y="288" width="512" height="54" rx="8" fill="#141C18" stroke="#10B981"/>
  <text x="710" y="311" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">acme-org/api-gateway</text>
  <text x="710" y="329" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">Private · main</text>
  <rect x="1120" y="303" width="68" height="22" rx="6" fill="#111916" stroke="#1E352C"/>
  <text x="1154" y="318" fill="#34D399" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">Selected</text>

  <rect x="692" y="352" width="512" height="54" rx="8" fill="#121217" stroke="#27272D"/>
  <text x="710" y="375" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="12.5" font-weight="500">acme-org/web-client</text>
  <text x="710" y="393" fill="#71717A" font-family="Inter, sans-serif" font-size="11">Private · main</text>
  <rect x="1096" y="367" width="64" height="22" rx="6" fill="#18181B" stroke="#27272A"/>
  <text x="1128" y="382" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">Indexed</text>
  <text x="1180" y="383" fill="#71717A" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">✕</text>

  <!-- Auto-sync toggle -->
  <rect x="692" y="420" width="512" height="36" rx="8" fill="#121217" stroke="#222227"/>
  <text x="708" y="442" fill="#D4D4D8" font-family="Inter, sans-serif" font-size="12">Auto-sync code graph on git push</text>

  <!-- Footer CTA -->
  <rect x="1076" y="632" width="128" height="36" rx="8" fill="url(#emeraldBtn)"/>
  <text x="1140" y="654" fill="#052E16" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
    Connect &amp; Index
  </text>
</svg>
