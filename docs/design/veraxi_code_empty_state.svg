<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="logoGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
  </defs>

  <!-- App Background -->
  <rect width="1280" height="800" fill="#0D0D0F"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="248" height="800" fill="#121215"/>
  <line x1="248" y1="0" x2="248" y2="800" stroke="#222227" stroke-width="1"/>

  <!-- Brand Header -->
  <text x="16" y="34" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="16" font-weight="700">Veraxi</text>
  <rect x="216" y="18" width="20" height="20" rx="4" fill="none" stroke="#52525B" stroke-width="1.2"/>

  <!-- Mode Switcher: Chat | Code -->
  <rect x="14" y="54" width="220" height="32" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="58" y="74" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12" font-weight="500">Chat</text>
  <rect x="124" y="57" width="107" height="26" rx="6" fill="#27272A"/>
  <text x="155" y="74" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="12" font-weight="600">&lt;&gt; Code</text>

  <!-- Sidebar Nav Items -->
  <text x="40" y="116" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12.5" font-weight="500">Knowledge Hub</text>
  <text x="40" y="144" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12.5" font-weight="500">Security</text>

  <line x1="14" y1="166" x2="234" y2="166" stroke="#222227" stroke-width="1"/>

  <!-- Projects Section (Repo-scoped threads only) -->
  <text x="16" y="192" fill="#71717A" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">Projects</text>
  <text x="16" y="218" fill="#71717A" font-family="Inter, sans-serif" font-size="12">No repos indexed yet</text>
  <text x="16" y="236" fill="#34D399" font-family="Inter, sans-serif" font-size="11">Index a repo in Repo X-Ray &#8594;</text>

  <!-- Main Code Canvas -->
  <rect x="260" y="12" width="1008" height="776" rx="14" fill="#060709" stroke="#1F1F23" stroke-width="1"/>

  <!-- Minimal Breadcrumb Header (omitted when no repo/thread is active) -->
  <line x1="260" y1="64" x2="1268" y2="64" stroke="#18181B" stroke-width="1"/>
  <rect x="276" y="27" width="22" height="22" rx="6" fill="#18181B" stroke="#2E2E36" stroke-width="1"/>
  <text x="281" y="42" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="10" font-weight="800">VX</text>

  <!-- Centered Antigravity-Inspired Empty State Hero -->
  <rect x="740" y="268" width="48" height="48" rx="14" fill="url(#logoGlow)" stroke="#2E2E36" stroke-width="1"/>
  <text x="752" y="299" fill="#D4D4D8" font-family="Inter, sans-serif" font-size="16" font-weight="800" letter-spacing="0.6">VX</text>

  <text x="764" y="354" text-anchor="middle" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.4">Good to see you, Kazuo. What's next?</text>
  <text x="764" y="382" text-anchor="middle" fill="#71717A" font-family="Inter, sans-serif" font-size="13.5">Ask anything about your indexed code.</text>

  <!-- Welded Repo / Branch Tray -->
  <rect x="364" y="592" width="800" height="40" rx="12" fill="#111115" stroke="#222227" stroke-width="1"/>
  <text x="394" y="616" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12.5">No indexed repos</text>
  <rect x="518" y="601" width="136" height="22" rx="6" fill="#182B24" stroke="#224438" stroke-width="1"/>
  <text x="530" y="616" fill="#34D399" font-family="Inter, sans-serif" font-size="11.5" font-weight="500">Index in Repo X-Ray &#8594;</text>
  <text x="1104" y="616" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12.5">main &#9662;</text>

  <!-- Code Chat Composer -->
  <rect x="364" y="642" width="800" height="96" rx="16" fill="#141418" stroke="#27272A" stroke-width="1"/>
  <text x="382" y="672" fill="#71717A" font-family="Inter, sans-serif" font-size="13.5">Ask anything, @ files, $ skills, / commands</text>
  <circle cx="1140" cy="712" r="14" fill="#F4F4F5"/>
  <text x="1135" y="717" fill="#09090B" font-family="Inter, sans-serif" font-size="14" font-weight="700">&#8593;</text>

  <!-- Below-composer Controls -->
  <rect x="364" y="746" width="150" height="26" rx="8" fill="#141418" stroke="#27272A" stroke-width="1"/>
  <text x="376" y="763" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11.5">openai/gpt-oss-20b &#9662;</text>
  <rect x="522" y="746" width="128" height="26" rx="8" fill="#141418" stroke="#27272A" stroke-width="1"/>
  <text x="534" y="763" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11.5">Thinking: Medium &#9662;</text>
  <rect x="658" y="746" width="88" height="26" rx="8" fill="#141418" stroke="#27272A" stroke-width="1"/>
  <text x="670" y="763" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11.5">Plan | Act</text>
</svg>
