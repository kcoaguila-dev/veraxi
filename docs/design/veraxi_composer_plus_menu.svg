<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Visual contract: Veraxi Unified "+" Add Context Menu & Decluttered Composer.
       Design decisions grounded in UX research & community feedback:
       1. Progressive disclosure: Consolidates file uploads, @ mentions, $ skills,
          / commands, Knowledge Sources, Web/Browser, and Connectors under one "+"
          Add Context popover instead of a crowded toolbar.
       2. Dual-modal entry: Every keyboard trigger (@, $, /) is surfaced as a
          keycap hint inside the "+" menu so mouse users discover shortcuts naturally.
       3. Conditional context chips: Hidden in the default empty state so the
          composer stays compact (matching Antigravity, Cursor, and Claude);
          chips only appear when a file or pasted snippet is actually attached.
       4. Human-intent labels: One "Files" action in "+" (smart default), and
          "Paste Text" for explicit raw-text snippets. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      .font-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <filter id="popoverShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Main Workspace Canvas -->
  <rect width="1440" height="900" fill="#212121"/>

  <!-- ========================================== -->
  <!-- LEFT SIDEBAR (236px, #171717)              -->
  <!-- ========================================== -->
  <rect x="0" y="0" width="236" height="900" fill="#171717"/>
  <line x1="236" y1="0" x2="236" y2="900" stroke="#262626" stroke-width="1"/>

  <!-- Brand Header + Sidebar Toggle -->
  <text x="18" y="34" fill="#FFFFFF" font-size="18" font-weight="600" class="font-inter">Veraxi</text>
  <g transform="translate(200, 19)" stroke="#9CA3AF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="2.5" width="16" height="13" rx="2.5"/>
    <line x1="7" y1="2.5" x2="7" y2="15.5"/>
  </g>

  <!-- Chat / Code Mode Switcher -->
  <rect x="16" y="52" width="204" height="32" rx="8" fill="#1F1F1F" stroke="#2C2C2C"/>
  <text x="68" y="72" fill="#9CA3AF" font-size="12.5" font-weight="500" text-anchor="middle" class="font-inter">Chat</text>
  <rect x="118" y="55" width="99" height="26" rx="6" fill="#2C2C2C"/>
  <text x="168" y="72" fill="#FFFFFF" font-size="12.5" font-weight="500" text-anchor="middle" class="font-inter">&lt;/&gt; Code</text>

  <!-- Primary Nav -->
  <g font-size="13.5" font-weight="500" class="font-inter">
    <g transform="translate(18, 102)" stroke="#B4B4B4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="2" width="12" height="14" rx="2"/>
      <line x1="6.5" y1="6" x2="11.5" y2="6"/>
      <line x1="6.5" y1="9.5" x2="11.5" y2="9.5"/>
    </g>
    <text x="44" y="114" fill="#E5E7EB">Knowledge Hub</text>

    <g transform="translate(18, 136)" stroke="#B4B4B4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 2L3.5 4.5V8.5C3.5 12 5.9 15.1 9 16C12.1 15.1 14.5 12 14.5 8.5V4.5L9 2Z"/>
    </g>
    <text x="44" y="149" fill="#E5E7EB">Security</text>
  </g>

  <!-- Projects Section -->
  <text x="18" y="196" fill="#737373" font-size="11.5" font-weight="600" class="font-inter">Projects</text>
  <g transform="translate(16, 208)">
    <rect width="204" height="28" rx="6" fill="#242424"/>
    <text x="26" y="18" fill="#FFFFFF" font-size="12.5" font-weight="500" class="font-inter">kcoagulla-dev/veraxi</text>
    <text x="188" y="19" fill="#9CA3AF" font-size="15" font-weight="400" class="font-inter">+</text>
  </g>
  <g font-size="12.5" fill="#A3A3A3" class="font-inter">
    <text x="28" y="258">README Content Summary</text>
    <text x="28" y="284">What README Says</text>
    <text x="28" y="310">Readme File Overview</text>
    <text x="28" y="336">Readme File Details</text>
    <text x="28" y="362">Readme File Contents</text>
  </g>

  <!-- Conversations Section -->
  <text x="18" y="408" fill="#737373" font-size="11.5" font-weight="600" class="font-inter">Conversations</text>
  <text x="204" y="409" fill="#737373" font-size="15" class="font-inter">+</text>
  <text x="24" y="434" fill="#A3A3A3" font-size="12.5" class="font-inter">Short Greeting</text>

  <!-- User Profile Footer -->
  <circle cx="30" cy="866" r="13" fill="#2E2E2E"/>
  <text x="30" y="871" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" class="font-inter">K</text>
  <text x="52" y="870" fill="#E5E7EB" font-size="13" font-weight="500" class="font-inter">Kazuo Coaguila</text>

  <!-- ========================================== -->
  <!-- MAIN WORKSPACE HEADER & GREETING           -->
  <!-- ========================================== -->
  <text x="258" y="32" fill="#8E8E8E" font-size="13" font-weight="500" class="font-inter">kcoagulla-dev/veraxi / New chat</text>

  <text x="838" y="402" fill="#F5F5F5" font-size="25" font-weight="600" text-anchor="middle" class="font-inter">Good to see you, Kazuo Coaguila. What's next?</text>
  <text x="838" y="428" fill="#8E8E8E" font-size="13.5" font-weight="400" text-anchor="middle" class="font-inter">Ask anything about kcoagulla-dev/veraxi.</text>

  <!-- ========================================== -->
  <!-- REDESIGNED COMPOSER CARD (Centered 760px)  -->
  <!-- Clean default state: no empty chips row    -->
  <!-- ========================================== -->
  <g transform="translate(458, 738)">
    <!-- Outer Composer Container -->
    <rect x="0" y="0" width="760" height="124" rx="18" fill="#2A2A2A" stroke="#3B3B3B" stroke-width="1"/>

    <!-- Top Context Strip (Mode, Repo, Branch) -->
    <g transform="translate(14, 12)" font-size="12.5" font-weight="500" class="font-inter">
      <!-- Chat only dropdown -->
      <rect x="0" y="0" width="94" height="26" rx="7" fill="#323232"/>
      <text x="12" y="17" fill="#D4D4D4">Chat only</text>
      <path d="M 76 11 L 80 15 L 84 11" stroke="#A3A3A3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Repo selector -->
      <rect x="102" y="0" width="156" height="26" rx="7" fill="#323232"/>
      <text x="114" y="17" fill="#D4D4D4">kcoagulla-dev/veraxi</text>
      <path d="M 241 11 L 245 15 L 249 11" stroke="#A3A3A3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Branch selector -->
      <rect x="266" y="0" width="68" height="26" rx="7" fill="#323232"/>
      <text x="278" y="17" fill="#D4D4D4">main</text>
      <path d="M 317 11 L 321 15 L 325 11" stroke="#A3A3A3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Prompt Input Area -->
    <text x="18" y="66" fill="#878787" font-size="14.5" font-weight="400" class="font-inter">Ask anything — @ files, $ skills, / commands</text>

    <!-- Bottom Action Bar (Decluttered) -->
    <g transform="translate(14, 82)" font-size="12.5" font-weight="500" class="font-inter">
      <!-- Active "+" Button (Popover Open State) -->
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#3E3E3E" stroke="#525252"/>
      <path d="M 15 9 V 21 M 9 15 H 21" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Model Selector -->
      <rect x="38" y="1" width="114" height="28" rx="7" fill="transparent"/>
      <text x="46" y="19" fill="#D4D4D4">gpt-oss-20b</text>
      <path d="M 134 13 L 138 17 L 142 13" stroke="#A3A3A3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Thinking Level Pill -->
      <rect x="156" y="1" width="132" height="28" rx="7" fill="#323232" stroke="#424242"/>
      <text x="168" y="19" fill="#D4D4D4">Thinking: Medium</text>
      <path d="M 271 13 L 275 17 L 279 13" stroke="#A3A3A3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Right Side Controls: Cline-style Plan | Act segmented toggle, Approval mode, Mic, Send -->
      <g transform="translate(476, 1)">
        <rect x="0" y="0" width="96" height="28" rx="8" fill="#1F1F23" stroke="#36363C" stroke-width="1"/>
        <!-- Plan (inactive) -->
        <text x="24" y="18.5" fill="#8E8E98" font-size="12" font-weight="500" text-anchor="middle">Plan</text>
        <!-- Act (active pill with subtle accent indicator) -->
        <rect x="48" y="2" width="46" height="24" rx="6" fill="#2C3545" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1"/>
        <circle cx="59" cy="14" r="2.8" fill="#60A5FA"/>
        <text x="74" y="18.5" fill="#F3F4F6" font-size="12" font-weight="600" text-anchor="middle">Act</text>
      </g>

      <rect x="578" y="1" width="74" height="28" rx="7" fill="transparent"/>
      <text x="586" y="19" fill="#D4D4D4">Default</text>
      <path d="M 636 13 L 640 17 L 644 13" stroke="#A3A3A3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Mic Icon -->
      <g transform="translate(664, 5)" stroke="#A3A3A3" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="2" width="6" height="10" rx="3"/>
        <path d="M 4 10 C 4 13.3 6.7 16 10 16 C 13.3 16 16 13.3 16 10"/>
        <line x1="10" y1="16" x2="10" y2="19"/>
      </g>

      <!-- Send Button -->
      <circle cx="716" cy="15" r="15" fill="#444444"/>
      <path d="M 716 20 V 10 M 711.5 14.5 L 716 10 L 720.5 14.5" stroke="#D4D4D4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- UNIFIED "+" ADD CONTEXT POPOVER MENU       -->
  <!-- Anchored above the "+" button (x=472)      -->
  <!-- ========================================== -->
  <g transform="translate(462, 434)" filter="url(#popoverShadow)">
    <rect x="0" y="0" width="264" height="378" rx="14" fill="#1C1C1F" stroke="#34343A" stroke-width="1"/>

    <!-- Section Header -->
    <text x="16" y="24" fill="#80808A" font-size="11" font-weight="600" letter-spacing="0.6" class="font-inter">ADD CONTEXT</text>

    <!-- Group 1: Files & Knowledge -->
    <g font-size="13.5" font-weight="500" class="font-inter">
      <!-- Item 1: Files (Hovered state example) -->
      <rect x="8" y="34" width="248" height="34" rx="8" fill="#2A2A30"/>
      <g transform="translate(18, 43)" stroke="#E5E7EB" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12.5 6.5 L 6.5 12.5 C 5.1 13.9 2.9 13.9 1.5 12.5 C 0.1 11.1 0.1 8.9 1.5 7.5 L 8.5 0.5 C 9.4 -0.4 10.9 -0.4 11.8 0.5 C 12.7 1.4 12.7 2.9 11.8 3.8 L 5.3 10.3 C 4.8 10.8 4 10.8 3.5 10.3 C 3 9.8 3 9 3.5 8.5 L 9 3"/>
      </g>
      <text x="44" y="56" fill="#FFFFFF">Files</text>
      <text x="242" y="55" fill="#71717A" font-size="11.5" text-anchor="end">Auto</text>

      <!-- Item 2: Folder / Repo -->
      <g transform="translate(18, 79)" stroke="#B4B4BC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 1 3 C 1 2 1.8 1.2 2.8 1.2 H 6 L 7.6 2.8 H 13.2 C 14.2 2.8 15 3.6 15 4.6 V 11.4 C 15 12.4 14.2 13.2 13.2 13.2 H 2.8 C 1.8 13.2 1 12.4 1 11.4 V 3 Z"/>
      </g>
      <text x="44" y="91" fill="#E4E4E7">Folder</text>

      <!-- Item 3: Mentions (@) -->
      <text x="20" y="126" fill="#B4B4BC" font-size="14" font-weight="600">@</text>
      <text x="44" y="126" fill="#E4E4E7">Mentions</text>
      <rect x="224" y="110" width="22" height="20" rx="5" fill="#27272D" stroke="#3A3A42"/>
      <text x="235" y="124" fill="#A1A1AA" font-size="11.5" text-anchor="middle">@</text>

      <!-- Item 4: Knowledge Sources -->
      <g transform="translate(18, 148)" stroke="#B4B4BC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="8" cy="3.5" rx="6" ry="2.2"/>
        <path d="M 2 3.5 V 8 C 2 9.2 4.7 10.2 8 10.2 C 11.3 10.2 14 9.2 14 8 V 3.5"/>
        <path d="M 2 8 V 12.5 C 2 13.7 4.7 14.7 8 14.7 C 11.3 14.7 14 13.7 14 12.5 V 8"/>
      </g>
      <text x="44" y="160" fill="#E4E4E7">Sources</text>
      <rect x="192" y="145" width="54" height="20" rx="10" fill="#1E3A5F"/>
      <text x="219" y="159" fill="#60A5FA" font-size="11" font-weight="600" text-anchor="middle">1 active</text>
    </g>

    <!-- Divider -->
    <line x1="14" y1="180" x2="250" y2="180" stroke="#2B2B32" stroke-width="1"/>

    <!-- Group 2: Actions, Skills & Web -->
    <g font-size="13.5" font-weight="500" class="font-inter">
      <!-- Item 5: Skills ($) -->
      <g transform="translate(18, 196)" stroke="#B4B4BC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8.5 1.5 L 3 9 H 8 L 7.5 14.5 L 13 7 H 8 L 8.5 1.5 Z"/>
      </g>
      <text x="44" y="208" fill="#E4E4E7">Skills</text>
      <rect x="224" y="193" width="22" height="20" rx="5" fill="#27272D" stroke="#3A3A42"/>
      <text x="235" y="207" fill="#A1A1AA" font-size="11.5" text-anchor="middle">$</text>

      <!-- Item 6: Commands (/) -->
      <g transform="translate(18, 230)" stroke="#B4B4BC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1.5" y="2" width="13" height="12" rx="2.5"/>
        <path d="M 5 6 L 7.5 8 L 5 10"/>
        <line x1="8.5" y1="10" x2="11" y2="10"/>
      </g>
      <text x="44" y="242" fill="#E4E4E7">Commands</text>
      <rect x="224" y="227" width="22" height="20" rx="5" fill="#27272D" stroke="#3A3A42"/>
      <text x="235" y="241" fill="#A1A1AA" font-size="11.5" text-anchor="middle">/</text>

      <!-- Item 7: Web Search / Browser -->
      <g transform="translate(18, 264)" stroke="#B4B4BC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6.2"/>
        <ellipse cx="8" cy="8" rx="2.8" ry="6.2"/>
        <line x1="2" y1="8" x2="14" y2="8"/>
      </g>
      <text x="44" y="276" fill="#E4E4E7">Web &amp; Browser</text>

      <!-- Item 8: Paste Text / Snippet (Replaces ambiguous "Upload as Text") -->
      <g transform="translate(18, 298)" stroke="#B4B4BC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 3 2 H 10 L 13 5 V 14 H 3 V 2 Z"/>
        <line x1="5.5" y1="7.5" x2="10.5" y2="7.5"/>
        <line x1="5.5" y1="10.5" x2="9" y2="10.5"/>
      </g>
      <text x="44" y="310" fill="#E4E4E7">Paste Text</text>
      <text x="242" y="310" fill="#71717A" font-size="11.5" text-anchor="end">Snippet</text>
    </g>

    <!-- Divider -->
    <line x1="14" y1="328" x2="250" y2="328" stroke="#2B2B32" stroke-width="1"/>

    <!-- Group 3: Connectors / Integrations -->
    <g font-size="13.5" font-weight="500" class="font-inter">
      <g transform="translate(18, 344)" stroke="#B4B4BC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 2 L 14 12.5 H 2 L 8 2 Z"/>
      </g>
      <text x="44" y="356" fill="#E4E4E7">Connectors</text>
      <text x="242" y="356" fill="#60A5FA" font-size="12.5" font-weight="500" text-anchor="end">Set up</text>
    </g>
  </g>
</svg>
