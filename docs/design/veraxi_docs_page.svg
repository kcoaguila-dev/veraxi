<svg width="1440" height="1080" viewBox="0 0 1440 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
      .font-sans { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
      .font-serif { font-family: 'Literata', Georgia, serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- Cool Paper Background (#EDF0EE) -->
  <rect width="1440" height="1080" fill="#EDF0EE" />

  <!-- ========================================== -->
  <!-- HEADER (120px..1320px)                     -->
  <!-- ========================================== -->
  <g transform="translate(120, 28)">
    <rect width="28" height="28" rx="6" fill="#2436C9" />
    <path d="M8.5 9L14 20L19.5 9" stroke="#F4F6F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="21" fill="#16191C" font-size="24" font-weight="800" letter-spacing="-0.7" class="font-sans">Veraxi</text>

    <g transform="translate(1200, 20)">
      <text x="-232" y="0" fill="#55606A" font-size="14" font-weight="600" class="font-sans" text-anchor="end">Overview</text>
      <text x="-152" y="0" fill="#2436C9" font-size="14" font-weight="700" class="font-sans" text-anchor="end">Docs &amp; API</text>
      <text x="-76" y="0" fill="#16191C" font-size="14" font-weight="600" class="font-sans" text-anchor="end">GitHub</text>
      <text x="0" y="0" fill="#16191C" font-size="14" font-weight="600" class="font-sans" text-anchor="end">Sign in</text>
    </g>
  </g>
  <line x1="120" y1="76" x2="1320" y2="76" stroke="#C3CBC6" stroke-width="1" stroke-opacity="0.7" />

  <!-- ========================================== -->
  <!-- MAIN 2-COLUMN DOCS & API LAYOUT            -->
  <!-- ========================================== -->
  <g transform="translate(120, 108)">
    <!-- LEFT SIDEBAR (280px) -->
    <g>
      <!-- Filter Input -->
      <rect width="280" height="40" rx="8" fill="#FAFBFA" stroke="#C3CBC6" stroke-width="1" />
      <text x="14" y="25" fill="#55606A" font-size="13" class="font-sans">Filter guides &amp; endpoints...</text>

      <!-- Section: GUIDES -->
      <text x="0" y="74" fill="#55606A" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">GUIDES</text>
      <rect y="86" width="280" height="36" rx="8" fill="#FAFBFA" stroke="#C3CBC6" stroke-width="1" />
      <text x="12" y="109" fill="#16191C" font-size="13.5" font-weight="600" class="font-sans">Quickstart &amp; Stack</text>
      <text x="12" y="144" fill="#55606A" font-size="13.5" font-weight="500" class="font-sans">Two-Tier JIT GraphRAG</text>
      <text x="12" y="176" fill="#55606A" font-size="13.5" font-weight="500" class="font-sans">vx CLI Reference</text>
      <text x="12" y="208" fill="#55606A" font-size="13.5" font-weight="500" class="font-sans">AppSec, SBOMs &amp; Rules</text>

      <!-- Section: REST API -->
      <text x="0" y="254" fill="#55606A" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">REST API</text>
      <rect y="266" width="280" height="38" rx="8" fill="#2436C9" />
      <rect x="10" y="275" width="42" height="20" rx="4" fill="#1B2A9E" />
      <text x="31" y="289" fill="#F4F6F4" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">POST</text>
      <text x="62" y="290" fill="#F4F6F4" font-size="13" font-weight="600" class="font-mono">/api/chat</text>

      <rect x="10" y="317" width="42" height="20" rx="4" fill="#E2E8F0" />
      <text x="31" y="331" fill="#16191C" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">POST</text>
      <text x="62" y="332" fill="#55606A" font-size="13" class="font-mono">/api/ingest</text>

      <rect x="10" y="353" width="42" height="20" rx="4" fill="#E2E8F0" />
      <text x="31" y="367" fill="#16191C" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">POST</text>
      <text x="62" y="368" fill="#55606A" font-size="13" class="font-mono">/api/v1/vuln/report</text>

      <rect x="10" y="389" width="42" height="20" rx="4" fill="#D1FAE5" />
      <text x="31" y="403" fill="#065F46" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">GET</text>
      <text x="62" y="404" fill="#55606A" font-size="13" class="font-mono">/api/v1/code/impact</text>

      <!-- Section: MCP TOOLS -->
      <text x="0" y="452" fill="#55606A" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">MCP TOOLS (/sse)</text>
      <text x="12" y="482" fill="#2436C9" font-size="13" font-weight="600" class="font-mono">mcp_merge_rank</text>
      <text x="12" y="514" fill="#55606A" font-size="13" class="font-mono">mcp_agentic_debate</text>
      <text x="12" y="546" fill="#55606A" font-size="13" class="font-mono">mcp_evaluate_grounding</text>
      <text x="12" y="578" fill="#55606A" font-size="13" class="font-mono">mcp_build_lazy_dossier</text>
    </g>

    <!-- RIGHT DETAIL PANEL (880px) -->
    <g transform="translate(320, 0)">
      <rect width="880" height="848" rx="12" fill="#FAFBFA" stroke="#C3CBC6" stroke-width="1" />

      <g transform="translate(36, 36)">
        <!-- Endpoint Header -->
        <rect width="54" height="24" rx="4" fill="#2436C9" />
        <text x="27" y="16" fill="#F4F6F4" font-size="11" font-weight="700" class="font-mono" text-anchor="middle">POST</text>
        <text x="66" y="17" fill="#16191C" font-size="16" font-weight="600" class="font-mono">/api/chat</text>
        <text x="808" y="17" fill="#2436C9" font-size="12.5" font-weight="600" class="font-sans" text-anchor="end">Swagger: localhost:8000/docs</text>

        <text x="0" y="62" fill="#16191C" font-size="30" font-weight="800" letter-spacing="-0.8" class="font-sans">Fast &amp; Deep Research Chat (SSE)</text>
        <text x="0" y="96" fill="#55606A" font-size="16" class="font-serif">Streams hybrid GraphRAG responses over Server-Sent Events with inline</text>
        <text x="0" y="120" fill="#55606A" font-size="16" class="font-serif">citation chips, retrieval tool events, and optional Skeptic verification.</text>

        <!-- Parameters Table -->
        <text x="0" y="168" fill="#55606A" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">REQUEST BODY</text>
        <rect y="182" width="808" height="156" rx="8" fill="#FFFFFF" stroke="#C3CBC6" stroke-width="1" />
        <line x1="0" y1="234" x2="808" y2="234" stroke="#EDF0EE" stroke-width="1" />
        <line x1="0" y1="286" x2="808" y2="286" stroke="#EDF0EE" stroke-width="1" />

        <text x="16" y="213" fill="#2436C9" font-size="13" font-weight="600" class="font-mono">message</text>
        <text x="148" y="213" fill="#55606A" font-size="12" class="font-mono">string · required</text>
        <text x="310" y="213" fill="#16191C" font-size="13.5" class="font-sans">User query or investigation prompt.</text>

        <text x="16" y="265" fill="#2436C9" font-size="13" font-weight="600" class="font-mono">mode</text>
        <text x="148" y="265" fill="#55606A" font-size="12" class="font-mono">"fast" | "deep"</text>
        <text x="310" y="265" fill="#16191C" font-size="13.5" class="font-sans">Fast (&lt;2s single loop) or Deep (LangGraph Skeptic swarm).</text>

        <text x="16" y="317" fill="#2436C9" font-size="13" font-weight="600" class="font-mono">tenant_id</text>
        <text x="148" y="317" fill="#55606A" font-size="12" class="font-mono">string · optional</text>
        <text x="310" y="317" fill="#16191C" font-size="13.5" class="font-sans">Tenant namespace for isolated Neo4j &amp; Qdrant retrieval.</text>

        <!-- Example Request (Dark Cobalt #0E1550) -->
        <text x="0" y="382" fill="#55606A" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">EXAMPLE REQUEST (CURL)</text>
        <rect y="396" width="808" height="132" rx="8" fill="#0E1550" />
        <rect x="734" y="410" width="58" height="24" rx="4" fill="#1B2A9E" />
        <text x="763" y="426" fill="#F4F6F4" font-size="11" font-weight="600" class="font-sans" text-anchor="middle">Copy</text>
        <text x="18" y="428" fill="#F4F6F4" font-size="13" class="font-mono">curl -N -X POST http://localhost:8000/api/chat \</text>
        <text x="18" y="454" fill="#F4F6F4" font-size="13" class="font-mono">  -H "Content-Type: application/json" \</text>
        <text x="18" y="480" fill="#F4F6F4" font-size="13" class="font-mono">  -d '{"message": "Who calls verify_jwt?", "mode": "deep"}'</text>

        <!-- Example SSE Response -->
        <text x="0" y="572" fill="#55606A" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">SSE STREAM EVENTS</text>
        <rect y="586" width="808" height="176" rx="8" fill="#FFFFFF" stroke="#C3CBC6" stroke-width="1" />
        <rect x="734" y="600" width="58" height="24" rx="4" fill="#EDF0EE" />
        <text x="763" y="616" fill="#2436C9" font-size="11" font-weight="600" class="font-sans" text-anchor="middle">Copy</text>
        <text x="18" y="622" fill="#2436C9" font-size="12.5" class="font-mono">event: tool_event</text>
        <text x="18" y="646" fill="#16191C" font-size="12.5" class="font-mono">data: {"tool": "mcp_merge_rank", "status": "done"}</text>
        <text x="18" y="682" fill="#2436C9" font-size="12.5" class="font-mono">event: token</text>
        <text x="18" y="706" fill="#16191C" font-size="12.5" class="font-mono">data: {"text": "verify_jwt is called by login_handler [1]"}</text>
        <text x="18" y="740" fill="#065F46" font-size="12.5" font-weight="600" class="font-mono">data: {"grounding_verified": true, "unsupported_claims": 0}</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <line x1="120" y1="1008" x2="1320" y2="1008" stroke="#C3CBC6" stroke-width="1" />
  <text x="120" y="1040" fill="#55606A" font-size="13" class="font-sans">Veraxi · Open source under MIT · Still in development</text>
</svg>
