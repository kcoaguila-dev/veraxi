<svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Veraxi — Chat Sandbox Toggle & Terminal/Diff Drawer
    (Hybrid Agentic Coding Sandbox, Phase 6)
    Visual contract for feat/hybrid-sandbox.

    Palette matches the existing dark chat UI (#212121 app,
    #171717 input, #2F2F2F card, #3F3F3F border, #10B981 live green,
    #F59E0B approval amber, #F87171 stderr/diff-removal red).

    1. Sandbox toggle — main now keeps integration/tool toggles in the
       chat composer's Tools (tune) menu, so Sandbox lives there as a
       menu entry with the same pin affordance as File Search /
       Run Code / Artifacts. Toggling/pinning it is bound to
       sandboxToggleViewModelProvider, which persists
       tool_settings["sandbox_enabled"] in SharedPreferences — the
       exact document the chat send path forwards to the backend, so
       the backend only injects the 4 sandbox tools for chats where
       it is true. While active, a "Sandbox" chip shows in the
       composer's active-tools row (tap to deactivate).
    2. Terminal & Diff Drawer — a collapsible drawer docked above the
       chat input, visible only while sandbox_enabled is true.
       Header: terminal icon, "Sandbox" title, session status dot,
       Terminal | Diff tabs, collapse chevron.
       Terminal tab: monospace streaming lines fed by the drawer
       view model (sandbox_stdout in white, sandbox_stderr in red),
       newest at the bottom.
       Approval cards: when the backend asks for approval
       (approval_required / autonomy gate), an amber-bordered card
       shows the tool/command with Approve / Reject buttons. The
       decision posts to POST /api/v1/sandboxes/sessions/{id}/approve.
       Diff tab: the current `git diff` with added lines in green,
       removed lines in red, context in grey, monospace.
  -->
  <rect width="1440" height="1000" fill="#212121"/>

  <!-- Header -->
  <text x="48" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Chat — Sandbox Toggle &amp; Drawer</text>
  <text x="48" y="102" font-family="Inter, sans-serif" font-size="14" fill="#9E9E9E">Composer Tools menu entry + collapsible Terminal &amp; Diff drawer above the chat input.</text>

  <!-- Tools menu mock -->
  <text x="48" y="152" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Composer — Tools Menu</text>
  <rect x="48" y="172" width="360" height="300" rx="12" fill="#171717" stroke="#3F3F3F"/>
  <text x="72" y="206" font-family="Inter, sans-serif" font-size="13" fill="#9E9E9E">▦  File Search</text>
  <text x="72" y="244" font-family="Inter, sans-serif" font-size="13" fill="#9E9E9E">◎  Web Search</text>
  <text x="72" y="282" font-family="Inter, sans-serif" font-size="13" fill="#9E9E9E">▣  Skills</text>
  <text x="72" y="320" font-family="Inter, sans-serif" font-size="13" fill="#9E9E9E">&gt;_  Run Code</text>
  <text x="72" y="358" font-family="Inter, sans-serif" font-size="13" fill="#9E9E9E">✦  Artifacts &gt;</text>
  <rect x="60" y="378" width="336" height="44" rx="8" fill="#10B981" fill-opacity="0.12"/>
  <text x="72" y="406" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">&gt;_  Sandbox</text>
  <text x="330" y="406" font-family="Inter, sans-serif" font-size="12" fill="#10B981">📌 pinned</text>
  <text x="72" y="452" font-family="Inter, sans-serif" font-size="11" fill="#9E9E9E">Pin = persist tool_settings["sandbox_enabled"]</text>

  <!-- Active chip mock -->
  <text x="460" y="206" font-family="Inter, sans-serif" font-size="13" fill="#9E9E9E">Active-tools row in the composer while Sandbox is on:</text>
  <rect x="460" y="222" width="150" height="34" rx="17" fill="#10B981" fill-opacity="0.12" stroke="#10B981"/>
  <text x="535" y="244" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="middle">&gt;_ Sandbox  ×</text>

  <!-- Drawer mock -->
  <text x="48" y="532" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Terminal &amp; Diff Drawer (above chat input, sandbox_enabled only)</text>
  <rect x="48" y="552" width="1320" height="400" rx="12" fill="#171717" stroke="#3F3F3F"/>
  <!-- Drawer header -->
  <text x="72" y="586" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">&gt;_  Sandbox</text>
  <circle cx="190" cy="581" r="4" fill="#10B981"/>
  <text x="202" y="586" font-family="Inter, sans-serif" font-size="12" fill="#10B981">running</text>
  <rect x="1050" y="562" width="110" height="32" rx="8" fill="#2F2F2F" stroke="#3F3F3F"/>
  <text x="1105" y="583" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Terminal</text>
  <rect x="1172" y="562" width="80" height="32" rx="8" fill="none" stroke="#3F3F3F"/>
  <text x="1212" y="583" font-family="Inter, sans-serif" font-size="12" fill="#9E9E9E" text-anchor="middle">Diff</text>
  <text x="1330" y="586" font-family="Inter, sans-serif" font-size="14" fill="#9E9E9E">⌃</text>
  <rect x="48" y="602" width="1320" height="1" fill="#3F3F3F"/>
  <!-- Terminal lines -->
  <text x="72" y="636" font-family="monospace" font-size="12" fill="#ECECEC">$ pytest backend/tests/test_sandbox_manager.py -q</text>
  <text x="72" y="662" font-family="monospace" font-size="12" fill="#ECECEC">..........                                        [100%]</text>
  <text x="72" y="688" font-family="monospace" font-size="12" fill="#10B981">10 passed in 1.24s</text>
  <text x="72" y="714" font-family="monospace" font-size="12" fill="#F87171">stderr: warning: sandbox idle timeout approaching</text>
  <!-- Approval card inside drawer -->
  <rect x="72" y="736" width="900" height="120" rx="12" fill="#2F2F2F" stroke="#F59E0B"/>
  <text x="96" y="768" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#F59E0B">⚠ Approval needed</text>
  <text x="96" y="794" font-family="monospace" font-size="12" fill="#FFFFFF">sandbox_exec · git push origin sandbox/session-1</text>
  <rect x="96" y="810" width="110" height="34" rx="8" fill="#10B981"/>
  <text x="151" y="832" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Approve</text>
  <rect x="218" y="810" width="110" height="34" rx="8" fill="none" stroke="#3F3F3F"/>
  <text x="273" y="832" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F87171" text-anchor="middle">Reject</text>
  <!-- Diff preview strip -->
  <text x="72" y="896" font-family="Inter, sans-serif" font-size="12" fill="#9E9E9E">Diff tab:</text>
  <text x="160" y="896" font-family="monospace" font-size="12" fill="#10B981">+ def start_session(...):</text>
  <text x="420" y="896" font-family="monospace" font-size="12" fill="#F87171">- def start(...):</text>
  <text x="620" y="896" font-family="monospace" font-size="12" fill="#9E9E9E">  context lines in grey, file headers bold white</text>
  <!-- Chat input mock -->
  <rect x="48" y="968" width="1320" height="1" fill="#3F3F3F"/>
  <text x="48" y="992" font-family="Inter, sans-serif" font-size="12" fill="#9E9E9E">Below the drawer: the regular chat input (Message Veraxi…).</text>
</svg>
