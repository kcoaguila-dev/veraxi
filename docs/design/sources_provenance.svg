<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- Visual contract:
       1. Grouped inline citation pills & multi-source hover card
          (implemented by markdown_citation_builder.dart + citation_chip.dart):
          consecutive citations combine into a single pill showing the first
          source and "+N" (e.g., "+1" for 2 sources, "+2" for 3 sources), and
          hovering displays "< 1/N >" navigation + overlapping favicons +
          "N sources" plus the active source's domain, calibrated Match Tier
          pill (when fused_score is present), title, a left accent-bordered
          verbatim excerpt matched to the cited claim sentence, and a
          "View in Sources →" action footer that opens the Sources drawer
          (never falling back to "Knowledge Base" for unmatched web citations).
       2. "Show me the path" provenance in the chat Sources drawer
          (implemented by sources_sidebar.dart + sources_button.dart), which
          parses the backend `provenance` object ({legs, fused_score,
          graph_path}) attached to merged retrieval results. Rules: leg badges
          render ONLY for legs actually present (Vector / Sparse / Graph);
          when fused_score is present, render a calibrated Match Tier pill
          ("High match" >= 0.025, "Medium match" >= 0.015, "Low match" < 0.015)
          by default, and gate the raw "Fused score" row behind Metrics
          (showTelemetry); graph path renders only when a graph traversal
          contributed a captured path, as indented node —relation→ node steps.
          Sources without provenance render exactly as before (no empty section). -->
  <rect width="1440" height="900" fill="#0E0E10"/>

  <!-- Left chat column -->
  <rect x="0" y="0" width="1090" height="900" fill="#171719"/>
  <text x="48" y="64" font-family="Inter, sans-serif" font-size="15" fill="#ECECEC" font-weight="600">How is Acme connected to Gamma?</text>
  <rect x="240" y="110" width="420" height="52" rx="12" fill="#26262A"/>
  <text x="260" y="142" font-family="Inter, sans-serif" font-size="13" fill="#D4D4D8">How is Acme connected to Gamma?</text>
  <text x="48" y="216" font-family="Inter, sans-serif" font-size="13" fill="#D4D4D8">Acme Corp acquired Beta LLC in 2023 [Acme Corp], and Beta</text>
  <text x="48" y="238" font-family="Inter, sans-serif" font-size="13" fill="#D4D4D8">supplies Gamma Inc [Beta LLC]…</text>
  <!-- Sources button pill -->
  <rect x="48" y="268" width="118" height="28" rx="14" fill="#1F1F23" stroke="#2E2E34"/>
  <text x="66" y="286" font-family="Inter, sans-serif" font-size="12" fill="#E0E0E0">2 sources</text>

  <!-- Grouped inline citation pill & multi-source hover popover -->
  <text x="48" y="348" font-family="Inter, sans-serif" font-size="13" fill="#D4D4D8">Leadership updates were reported after the transition</text>
  <rect x="380" y="333" width="152" height="22" rx="11" fill="#272727" stroke="#3D3D3D"/>
  <circle cx="392" cy="344" r="5.5" fill="#4F8EF7"/>
  <text x="403" y="348" font-family="Inter, sans-serif" font-size="11" fill="#CCCCCC" font-weight="500">Colette Kress - Wi…</text>
  <text x="510" y="348" font-family="Inter, sans-serif" font-size="11" fill="#8C8C8C" font-weight="600">+1</text>

  <!-- Multi-source hover card -->
  <rect x="380" y="366" width="320" height="202" rx="12" fill="#1B1B1E" stroke="#2E2E2E"/>
  <text x="394" y="388" font-family="Inter, sans-serif" font-size="12" fill="#A0A0A0">&lt;  1/2  &gt;</text>
  <circle cx="610" cy="384" r="6" fill="#4F8EF7" stroke="#1B1B1E"/>
  <circle cx="620" cy="384" r="6" fill="#7E57C2" stroke="#1B1B1E"/>
  <text x="632" y="388" font-family="Inter, sans-serif" font-size="11" fill="#CCCCCC" font-weight="500">2 sources</text>
  <rect x="380" y="400" width="320" height="1" fill="#2E2E2E"/>
  <circle cx="400" cy="420" r="7" fill="#4F8EF7"/>
  <text x="414" y="424" font-family="Inter, sans-serif" font-size="11" fill="#A0A0A0" font-weight="500">wikipedia</text>
  <rect x="614" y="410" width="72" height="20" rx="10" fill="#172B1F" stroke="#22C55E"/>
  <text x="625" y="423" font-family="Inter, sans-serif" font-size="10" fill="#A7F3D0" font-weight="500">High match</text>
  <text x="394" y="450" font-family="Inter, sans-serif" font-size="13" fill="#E8E8E8" font-weight="600">Colette Kress - Wikipedia</text>
  <rect x="394" y="462" width="2" height="36" rx="1" fill="#4F8EF7"/>
  <text x="404" y="474" font-family="Inter, sans-serif" font-size="12" fill="#B8B8B8">Colette Marie Kress is an American business</text>
  <text x="404" y="492" font-family="Inter, sans-serif" font-size="12" fill="#B8B8B8">executive serving as interim CEO...</text>
  <rect x="380" y="524" width="320" height="1" fill="#2E2E2E"/>
  <text x="394" y="548" font-family="Inter, sans-serif" font-size="11" fill="#878787">Provenance &amp; context</text>
  <text x="596" y="548" font-family="Inter, sans-serif" font-size="11" fill="#4F8EF7" font-weight="600">View in Sources →</text>

  <rect x="48" y="812" width="994" height="52" rx="26" fill="#1F1F23" stroke="#2E2E34"/>
  <text x="72" y="844" font-family="Inter, sans-serif" font-size="13" fill="#71717A">Reply</text>

  <!-- Right Sources drawer (350px, matches SourcesSidebar width) -->
  <rect x="1090" y="0" width="350" height="900" fill="#1B1B1E"/>
  <text x="1110" y="44" font-family="Inter, sans-serif" font-size="18" fill="#FFFFFF" font-weight="600">▤ Sources</text>
  <text x="1408" y="44" font-family="Inter, sans-serif" font-size="15" fill="#B4B4B4">✕</text>
  <rect x="1090" y="64" width="350" height="1" fill="#2E2E34"/>

  <!-- Source card 1: graph + vector, with graph path -->
  <rect x="1110" y="84" width="310" height="342" rx="12" fill="#222226" stroke="#2E2E34"/>
  <rect x="1126" y="100" width="24" height="24" rx="6" fill="#2E2E34"/>
  <text x="1134" y="117" font-family="Inter, sans-serif" font-size="12" fill="#D4D4D8" font-weight="700">1</text>
  <text x="1158" y="117" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Internal Database</text>
  <text x="1126" y="152" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Acme Corp — Beta LLC acquisition filing</text>
  <text x="1126" y="176" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">…Acme Corp completed the acquisition of Beta LLC…</text>

  <!-- Provenance section: divider, badges, match tier, optional fused score (Metrics mode), graph path -->
  <rect x="1126" y="196" width="278" height="1" fill="#2E2E34"/>
  <text x="1126" y="218" font-family="Inter, sans-serif" font-size="11" fill="#878787" letter-spacing="1">PROVENANCE</text>
  <rect x="1126" y="230" width="62" height="22" rx="11" fill="#233148" stroke="#4F8EF7"/>
  <text x="1140" y="245" font-family="Inter, sans-serif" font-size="11" fill="#BFD7FB">Vector</text>
  <rect x="1196" y="230" width="58" height="22" rx="11" fill="#2E2417" stroke="#D98A2B"/>
  <text x="1210" y="245" font-family="Inter, sans-serif" font-size="11" fill="#F3D3A7">Graph</text>
  <rect x="1262" y="230" width="84" height="22" rx="11" fill="#172B1F" stroke="#22C55E"/>
  <text x="1275" y="245" font-family="Inter, sans-serif" font-size="11" fill="#A7F3D0" font-weight="500">High match</text>
  <text x="1126" y="276" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">Fused score (Metrics on)</text>
  <text x="1276" y="276" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC" font-weight="600">0.032</text>
  <!-- Graph path: indented steps, node —relation→ node -->
  <text x="1126" y="304" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Acme Corp</text>
  <text x="1142" y="326" font-family="Inter, sans-serif" font-size="12" fill="#878787">— ACQUIRED →</text>
  <text x="1142" y="348" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Beta LLC</text>
  <text x="1158" y="370" font-family="Inter, sans-serif" font-size="12" fill="#878787">— SUPPLIES →</text>
  <text x="1158" y="392" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC">Gamma Inc</text>

  <!-- Source card 2: vector only, no graph path row -->
  <rect x="1110" y="446" width="310" height="196" rx="12" fill="#222226" stroke="#2E2E34"/>
  <rect x="1126" y="462" width="24" height="24" rx="6" fill="#2E2E34"/>
  <text x="1134" y="479" font-family="Inter, sans-serif" font-size="12" fill="#D4D4D8" font-weight="700">2</text>
  <text x="1158" y="479" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Internal Database</text>
  <text x="1126" y="514" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Gamma Inc annual report excerpt</text>
  <rect x="1126" y="534" width="278" height="1" fill="#2E2E34"/>
  <text x="1126" y="556" font-family="Inter, sans-serif" font-size="11" fill="#878787" letter-spacing="1">PROVENANCE</text>
  <rect x="1126" y="568" width="62" height="22" rx="11" fill="#233148" stroke="#4F8EF7"/>
  <text x="1140" y="583" font-family="Inter, sans-serif" font-size="11" fill="#BFD7FB">Vector</text>
  <rect x="1196" y="568" width="98" height="22" rx="11" fill="#233148" stroke="#4F8EF7"/>
  <text x="1209" y="583" font-family="Inter, sans-serif" font-size="11" fill="#BFD7FB" font-weight="500">Medium match</text>
  <text x="1126" y="614" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA">Fused score (Metrics on)</text>
  <text x="1276" y="614" font-family="Inter, sans-serif" font-size="12" fill="#ECECEC" font-weight="600">0.016</text>

  <!-- Source card 3: legacy source without provenance — unchanged UI -->
  <rect x="1110" y="662" width="310" height="120" rx="12" fill="#222226" stroke="#2E2E34"/>
  <rect x="1126" y="678" width="24" height="24" rx="6" fill="#2E2E34"/>
  <text x="1134" y="695" font-family="Inter, sans-serif" font-size="12" fill="#D4D4D8" font-weight="700">3</text>
  <text x="1158" y="695" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">example.com</text>
  <text x="1126" y="730" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Web result (no provenance — card unchanged)</text>
</svg>
