  <rect x="1080" y="0" width="360" height="900" fill="#171717"/>
  <line x1="1080" y1="0" x2="1080" y2="900" stroke="#2B2B2E" stroke-width="1"/>

  <text x="1128" y="34" fill="#FFFFFF" font-size="15" font-weight="600" class="font-inter">Sources</text>
  <rect x="1100" y="21" width="16" height="16" rx="3" stroke="#9CA3AF" stroke-width="1.4" fill="none"/>
  <path d="M1410 22 L1422 34 M1422 22 L1410 34" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Source Card 1 (Non-code retrieval reference, matches native Sources drawer) -->
  <g transform="translate(1098, 66)">
    <rect x="0" y="0" width="324" height="196" rx="12" fill="#1F1F23" stroke="#2E2E34" stroke-width="1"/>
    <rect x="14" y="14" width="20" height="20" rx="5" fill="#2A2A2F"/>
    <text x="24" y="28" fill="#D4D4D8" font-size="11" text-anchor="middle" class="font-inter">1</text>
    <text x="42" y="28" fill="#9CA3AF" font-size="11.5" class="font-inter">en.wikipedia.org</text>

    <text x="14" y="54" fill="#F4F4F5" font-size="13" font-weight="600" class="font-inter">Colette Kress - Wikipedia</text>
    <text x="14" y="74" fill="#A1A1AA" font-size="11.5" class="font-inter">Colette Marie Kress is an American business</text>
    <text x="14" y="90" fill="#A1A1AA" font-size="11.5" class="font-inter">executive. She has been the interim chief</text>
    <text x="14" y="106" fill="#A1A1AA" font-size="11.5" class="font-inter">executive officer of Nvidia since Nov 12, 2026.</text>

    <!-- PROVENANCE -->
    <text x="14" y="136" fill="#71717A" font-size="10" font-weight="600" letter-spacing="0.6" class="font-inter">PROVENANCE</text>
    <g transform="translate(14, 148)" class="font-inter" font-size="10.5" font-weight="600">
      <rect x="0" y="0" width="48" height="22" rx="11" fill="#1E293B" stroke="#3B82F6" stroke-width="0.7"/>
