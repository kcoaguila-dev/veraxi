    <path d="M586 47 A13 13 0 0 1 598 55" stroke="#10B981" stroke-width="2" fill="none"/>
    <text x="586" y="64" fill="#D4D4D8" font-size="9.5" text-anchor="middle" class="font-inter">2.5k</text>

    <g transform="translate(616, 51)" stroke="#9CA3AF" stroke-width="1.4" fill="none" stroke-linecap="round">
